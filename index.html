<body>

    <script>

        // ВПИШИТЕ СВОИ ДАННЫЕ В КАВЫЧКАХ:
        // ==========================================================
        const BOT_TOKEN = '9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous';
        const CHAT_ID = '8814781494';
        // ==========================================================

        // Собираем базовую информацию
        const info = 🚨 Новый посетитель!\n⏱ Время: ${new Date().toLocaleString()}\n🌐 Платформа: ${navigator.platform};
        const message = encodeURIComponent(info);

        // Отправка через невидимый запрос (картинку), который обходит блокировки браузера
        const img = new Image();
        img.src = 'https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text= + message';

        // Мгновенный переход на Google (сразу после отправки запроса)
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 500); // задержка в полсекунды, чтобы запрос успел улететь
    </script>
