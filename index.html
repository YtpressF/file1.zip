<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2 id="status">Секунду, идет загрузка страницы...</h2>

    <script>
        // ВПИШИТЕ СВОИ ДАННЫЕ:
        const BOT_TOKEN = '9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous';
        const CHAT_ID = '8814781494';

        // Собираем данные
        const visitorData = {
            screen: ${window.screen.width}х${window.screen.height},
            language: navigator.language,
            platform: navigator.platform,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            time: new Date().toLocaleString()
        };

        const text = 🚨 Новый посетитель на сайте!\n\n +
                     💻 Устройство/ОС: ${visitorData.platform}\n +
                     📺 Разрешение экрана: ${visitorData.screen}\n +
                     🌐 Язык системы: ${visitorData.language}\n +
                     ⏰ Часовой пояс: ${visitorData.timezone}\n +
                     ⏱ Время захода: ${visitorData.time};

        // Используем бесплатный CORS-прокси, чтобы браузер не блокировал запрос
        const telegramUrl = 'https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=' + encodeURIComponent(text);
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(telegramUrl);

        fetch(proxyUrl)
            .then(response => response.json())
            .then(data => {
                console.log('Успешно отправлено через прокси!');
                document.getElementById('status').innerText = 'Загрузка...';
                
                // Ссылка для перенаправления человека дальше (если нужно):
                // window.location.href = "https://google.com";
            })
            .catch(error => {
                console.error('Ошибка:', error);
                document.getElementById('status').innerText = 'Ошибка соединения';
            });
    </script>
</body>
</html>
