<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        // ==========================================================
        // ВПИШИТЕ СВОИ ДАННЫЕ В КАВЫЧКАХ:
        // ==========================================================
        const BOT_TOKEN = '9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous';
        const CHAT_ID = '8814781494';
        // ==========================================================

        // Собираем техническую информацию о посетителе
        const visitorData = {
            screen: '${window.screen.width}х${window.screen.height}',
            language: navigator.language,
            platform: navigator.platform,
            time: new Date().toLocaleString()
        };

        // Текст сообщения
        const text = '🚨 Новый посетитель на сайте!\n\n' +
                     '💻 Платформа: ${visitorData.platform}\n' +
                     '📺 Экран: ${visitorData.screen}\n' +
                     '🌐 Язык: ${visitorData.language}\n' +
                     '⏱ Время: ${visitorData.time}';

        // Ссылка для отправки через Telegram Bot API
        const url = 'https://api.telegram.org/bot${BOT_TOKEN}/sendMessage';

        // Отправляем данные методом POST
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text
            })
        }).finally(() => {
            // В любом случае (даже если отправка зависла) через 0.8 секунды перенаправляем в Google
            setTimeout(() => {
                window.location.href = "https://google.com";
            }, 2000);
        });
    </script>
</body>
</html>
