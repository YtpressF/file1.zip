<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест</title>
</head>
<body>
    <h1 id="text">Если вы видите это, значит JS заблокирован или файл не тот!</h1>

    <script>
        // Этот скрипт должен мгновенно изменить текст на экране и перебросить в Google через 2 секунды
        document.getElementById('text').innerText = "JavaScript работает! Переходим...";
        
        setTimeout(() => {
            window.location.href = "https://google.com";
        }, 2000);
    </script>
</body>
</html>
